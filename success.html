<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="Your Zelf.com acquisition inquiry has been received.">
  <title>Inquiry Received — Zelf.com</title>
  <style>
    *{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#07111f;color:#fff}
    body{min-height:100vh;display:grid;place-items:center;padding:24px;background:radial-gradient(circle at 70% 20%,#123b77 0,rgba(18,59,119,.28) 24%,transparent 48%),linear-gradient(145deg,#07111f,#09192e)}
    .card{width:min(720px,100%);padding:64px 52px;border:1px solid rgba(255,255,255,.12);border-radius:28px;background:rgba(8,21,39,.78);box-shadow:0 30px 90px rgba(0,0,0,.35);text-align:center;backdrop-filter:blur(10px)}
    .logo{font-size:26px;font-weight:800;letter-spacing:-1px;margin-bottom:42px}.logo span,h1 span{color:#2f8cff}
    .check{width:70px;height:70px;margin:0 auto 26px;border-radius:50%;display:grid;place-items:center;background:rgba(47,140,255,.13);border:1px solid rgba(47,140,255,.45);font-size:32px}
    .eyebrow{font-size:12px;letter-spacing:.16em;color:#7db5ff;font-weight:800;margin-bottom:12px}
    h1{font-size:clamp(36px,7vw,58px);line-height:1.02;margin:0 0 18px;letter-spacing:-2px}
    p{color:#b9c6d8;font-size:17px;line-height:1.7;margin:0 auto 30px;max-width:560px}
    .button{display:inline-block;padding:15px 24px;border-radius:999px;background:#2587ff;color:#fff;text-decoration:none;font-weight:800}
    .email{margin-top:25px;font-size:14px;color:#8395ac}.email a{color:#a9ccff}
    @media(max-width:600px){body{padding:16px}.card{padding:46px 22px;border-radius:22px}.logo{margin-bottom:34px}p{font-size:16px}}
  </style>
</head>
<body>
  <main class="card">
    <div class="logo">Zelf<span>.com</span></div>
    <div class="check">✓</div>
    <div class="eyebrow">INQUIRY RECEIVED</div>
    <h1>Thank you for your <span>interest.</span></h1>
    <p>Your acquisition inquiry has been received. We’ll review your message and get back to you by email shortly.</p>
    <a class="button" href="index.html">Return to Zelf.com →</a>
    <div class="email">Prefer direct email? <a href="mailto:adam@zelf.com">adam@zelf.com</a></div>
  </main>
</body>
</html>
